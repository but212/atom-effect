name: Benchmark

on:
  push:
    branches: [main]

jobs:
  setup:
    name: Setup and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          install-playwright: "true"

      - name: Build
        run: pnpm build

      - name: Cache workspace dependencies and builds
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-workspace-${{ github.sha }}

  benchmark:
    name: ${{ matrix.name }} - ${{ matrix.package }} (${{ matrix.type }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Logic
            package: core
            type: micro
          - name: Logic
            package: core
            type: macro
          - name: Logic
            package: core
            type: state
          - name: Logic
            package: core
            type: realistic
          - name: Logic
            package: utils
            type: all
          - name: Browser
            package: jquery
            type: micro
          - name: Browser
            package: jquery
            type: macro

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          skip-install: "true"

      - name: Restore workspace dependencies and builds
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-workspace-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Run benchmark
        working-directory: packages/${{ matrix.package }}
        env:
          BENCH_OUTPUT: ../../results/${{ matrix.package }}-${{ matrix.type }}.txt
        run: |
          mkdir -p ../../results
          pnpm bench:${{ matrix.type }} > $BENCH_OUTPUT

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ matrix.package }}-${{ matrix.type }}
          path: results/

  cleanup:
    name: Cleanup Temporary Cache
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete temporary workflow cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache delete "${{ runner.os }}-workspace-${{ github.sha }}" || true
