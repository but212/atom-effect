name: Benchmark

on:
  push:
    branches: [main]

jobs:
  setup:
    name: Setup and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          install-playwright: "false"

      - name: Build
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: packages/*/dist

  benchmark:
    name: ${{ matrix.name }} - ${{ matrix.package }} (${{ matrix.type }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Logic
            package: core
            type: micro
            playwright: "false"
          - name: Logic
            package: core
            type: macro
            playwright: "false"
          - name: Logic
            package: core
            type: state
            playwright: "false"
          - name: Logic
            package: core
            type: realistic
            playwright: "false"
          - name: Logic
            package: utils
            type: all
            playwright: "false"
          - name: Browser
            package: jquery
            type: micro
            playwright: "true"
          - name: Browser
            package: jquery
            type: macro
            playwright: "true"

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          install-playwright: ${{ matrix.playwright }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: packages

      - name: Run benchmark
        working-directory: packages/${{ matrix.package }}
        env:
          BENCH_OUTPUT: ../../results/${{ matrix.package }}-${{ matrix.type }}.txt
        run: |
          mkdir -p ../../results
          if [ "${{ matrix.type }}" = "all" ]; then
            pnpm bench:all > $BENCH_OUTPUT
          else
            pnpm bench:${{ matrix.type }} > $BENCH_OUTPUT
          fi

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ matrix.package }}-${{ matrix.type }}
          path: results/
