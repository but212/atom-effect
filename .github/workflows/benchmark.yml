name: Benchmark

on:
  push:
    branches: [main]

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Run micro benchmarks
        working-directory: packages/core
        run: pnpm bench:micro

      - name: Run macro benchmarks
        working-directory: packages/core
        run: pnpm bench:macro

      - name: Run realistic benchmarks
        working-directory: packages/core
        run: pnpm bench:realistic
