name: Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    name: ${{ matrix.package }} (${{ matrix.type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: core
            type: micro
          - package: core
            type: macro
          - package: core
            type: state
          - package: core
            type: realistic
          - package: utils
            type: all
          - package: jquery
            type: micro
            playwright: "true"
          - package: jquery
            type: macro
            playwright: "true"

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          install-playwright: ${{ matrix.playwright || 'false' }}

      - name: Build
        run: pnpm build

      - name: Run benchmark
        working-directory: packages/${{ matrix.package }}
        run: |
          mkdir -p ../../results
          pnpm bench:${{ matrix.type }} > ../../results/${{ matrix.package }}-${{ matrix.type }}.txt

      - name: Upload temporary result
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-raw-${{ matrix.package }}-${{ matrix.type }}
          path: results/${{ matrix.package }}-${{ matrix.type }}.txt

  collect-results:
    name: Collect Results
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all raw results
        uses: actions/download-artifact@v7
        with:
          pattern: benchmark-raw-*
          merge-multiple: true
          path: results-merged/

      - name: Upload merged results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: results-merged/


