name: Benchmark

on:
  push:
    branches: [main]

jobs:
  setup:
    name: Setup and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          install-playwright: "false"

      - name: Build
        run: pnpm build

      - name: Cache workspace dependencies and builds
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
          key: ${{ runner.os }}-workspace-${{ github.sha }}

  benchmark:
    name: ${{ matrix.name }} - ${{ matrix.package }} (${{ matrix.type }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Logic
            package: core
            type: micro
            playwright: "false"
          - name: Logic
            package: core
            type: macro
            playwright: "false"
          - name: Logic
            package: core
            type: state
            playwright: "false"
          - name: Logic
            package: core
            type: realistic
            playwright: "false"
          - name: Logic
            package: utils
            type: all
            playwright: "false"
          - name: Browser
            package: jquery
            type: micro
            playwright: "true"
          - name: Browser
            package: jquery
            type: macro
            playwright: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm path
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Restore workspace dependencies and builds
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
          key: ${{ runner.os }}-workspace-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Install Playwright Browsers
        if: matrix.playwright == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run benchmark
        working-directory: packages/${{ matrix.package }}
        env:
          BENCH_OUTPUT: ../../results/${{ matrix.package }}-${{ matrix.type }}.txt
        run: |
          mkdir -p ../../results
          if [ "${{ matrix.type }}" = "all" ]; then
            pnpm bench:all > $BENCH_OUTPUT
          else
            pnpm bench:${{ matrix.type }} > $BENCH_OUTPUT
          fi

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ matrix.package }}-${{ matrix.type }}
          path: results/
