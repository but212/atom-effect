name: Benchmark

on:
  push:
    branches: [main]

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Install Playwright Browsers
        run: npx -y playwright install --with-deps chromium

      - name: Run micro benchmarks
        working-directory: packages/core
        run: pnpm bench:micro | tee ../../benchmark-micro.txt

      - name: Run macro benchmarks
        working-directory: packages/core
        run: pnpm bench:macro | tee ../../benchmark-macro.txt

      - name: Run realistic benchmarks
        working-directory: packages/core
        run: pnpm bench:realistic | tee ../../benchmark-realistic.txt

      - name: Run jQuery micro benchmarks
        working-directory: packages/jquery
        run: pnpm bench:micro | tee ../../benchmark-jquery-micro.txt

      - name: Run jQuery macro benchmarks
        working-directory: packages/jquery
        run: pnpm bench:macro | tee ../../benchmark-jquery-macro.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmark-micro.txt
            benchmark-macro.txt
            benchmark-realistic.txt
            benchmark-jquery-micro.txt
            benchmark-jquery-macro.txt
