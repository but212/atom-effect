name: Benchmark

on:
  push:
    branches: [main]

jobs:
  benchmark:
    name: Run ${{ matrix.package }} (${{ matrix.type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, jquery]
        type: [micro, macro, realistic]
        exclude:
          - package: jquery
            type: realistic

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          install-playwright: "true"

      - name: Build
        run: pnpm build

      - name: Run benchmark
        working-directory: packages/${{ matrix.package }}
        run: |
          mkdir -p ../../results
          pnpm bench:${{ matrix.type }} | tee ../../results/${{ matrix.package }}-${{ matrix.type }}.txt

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: results/
