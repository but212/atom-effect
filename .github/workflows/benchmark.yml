name: Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    name: ${{ matrix.package }} (${{ matrix.type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: core
            type: micro
          - package: core
            type: macro
          - package: core
            type: state
          - package: core
            type: realistic
          - package: utils
            type: all
          - package: jquery
            type: micro
            playwright: "true"
          - package: jquery
            type: macro
            playwright: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          install-playwright: ${{ matrix.playwright || 'false' }}

      - name: Build
        run: pnpm build

      - name: Run benchmark
        working-directory: packages/${{ matrix.package }}
        run: |
          mkdir -p ../../results
          pnpm bench:${{ matrix.type }} > ../../results/${{ matrix.package }}-${{ matrix.type }}.txt

      - name: Upload temporary result
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-raw-${{ matrix.package }}-${{ matrix.type }}
          path: results/${{ matrix.package }}-${{ matrix.type }}.txt

  collect-results:
    name: Collect Results
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Download all raw results
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-raw-*
          merge-multiple: true
          path: results-merged/

      - name: Validate benchmark documentation updater
        run: node --test scripts/update-benchmarks.test.js

      - name: Update benchmark documentation
        run: node scripts/update-benchmarks.js results-merged

      - name: Validate refreshed benchmark documentation
        shell: bash
        run: |
          git diff --check -- \
            packages/core/docs/BENCHMARKS.md \
            packages/core/docs/BENCHMARKS_DETAILED.md \
            packages/jquery/docs/BENCHMARKS.md \
            packages/jquery/docs/BENCHMARKS_DETAILED.md \
            packages/utils/docs/BENCHMARKS.md \
            packages/utils/docs/BENCHMARKS_DETAILED.md
          test -s packages/core/docs/BENCHMARKS.md
          test -s packages/core/docs/BENCHMARKS_DETAILED.md
          test -s packages/jquery/docs/BENCHMARKS.md
          test -s packages/jquery/docs/BENCHMARKS_DETAILED.md
          test -s packages/utils/docs/BENCHMARKS.md
          test -s packages/utils/docs/BENCHMARKS_DETAILED.md

      - name: Create commit-ready benchmark documentation patch
        shell: bash
        run: |
          git diff --binary -- \
            packages/core/docs/BENCHMARKS.md \
            packages/core/docs/BENCHMARKS_DETAILED.md \
            packages/jquery/docs/BENCHMARKS.md \
            packages/jquery/docs/BENCHMARKS_DETAILED.md \
            packages/utils/docs/BENCHMARKS.md \
            packages/utils/docs/BENCHMARKS_DETAILED.md > benchmark-docs.patch
          git diff --stat -- \
            packages/core/docs/BENCHMARKS.md \
            packages/core/docs/BENCHMARKS_DETAILED.md \
            packages/jquery/docs/BENCHMARKS.md \
            packages/jquery/docs/BENCHMARKS_DETAILED.md \
            packages/utils/docs/BENCHMARKS.md \
            packages/utils/docs/BENCHMARKS_DETAILED.md > benchmark-docs-summary.txt

      - name: Upload merged results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: results-merged/

      - name: Upload refreshed benchmark documentation
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-docs-updated
          path: |
            packages/core/docs/BENCHMARKS.md
            packages/core/docs/BENCHMARKS_DETAILED.md
            packages/jquery/docs/BENCHMARKS.md
            packages/jquery/docs/BENCHMARKS_DETAILED.md
            packages/utils/docs/BENCHMARKS.md
            packages/utils/docs/BENCHMARKS_DETAILED.md
            benchmark-docs.patch
            benchmark-docs-summary.txt


