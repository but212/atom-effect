name: Publish to NPM

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish Packages
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check version match
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          JQUERY_VERSION=$(node -p "require('./packages/jquery/package.json').version")

          if [ "$TAG_VERSION" != "$CORE_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match core package.json version ($CORE_VERSION)"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$JQUERY_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match jquery package.json version ($JQUERY_VERSION)"
            exit 1
          fi

          echo "✓ All package versions match tag: $TAG_VERSION"

      - name: Extract changelog entry
        id: changelog
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if ! grep -q "## \[${TAG_VERSION}\]" CHANGELOG.md; then
            echo "Error: CHANGELOG.md does not contain an entry for version ${TAG_VERSION}"
            exit 1
          fi
          awk "/## \[${TAG_VERSION}\]/{flag=1;next}/## \[/{flag=0}flag" CHANGELOG.md > RELEASE_NOTES.md

      - uses: ./.github/actions/setup
        with:
          registry-url: "https://registry.npmjs.org"
          install-playwright: "true"

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test:run

      - name: Publish @but212/atom-effect
        working-directory: packages/core
        run: pnpm publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @but212/atom-effect-jquery
        working-directory: packages/jquery
        run: pnpm publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: success()
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
