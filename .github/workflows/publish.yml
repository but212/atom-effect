name: Publish to NPM

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    outputs:
      release_notes: ${{ steps.verify.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify versions and extract changelog
        id: verify
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          JQUERY_VERSION=$(node -p "require('./packages/jquery/package.json').version")

          if [ "$TAG_VERSION" != "$CORE_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match core package.json version ($CORE_VERSION)"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$JQUERY_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match jquery package.json version ($JQUERY_VERSION)"
            exit 1
          fi

          echo "✓ All package versions match tag: $TAG_VERSION"

          if ! grep -q "## \[${TAG_VERSION}\]" CHANGELOG.md; then
            echo "Error: CHANGELOG.md does not contain an entry for version ${TAG_VERSION}"
            exit 1
          fi
          awk "/## \[${TAG_VERSION}\]/{flag=1;next}/## \[/{flag=0}flag" CHANGELOG.md > RELEASE_NOTES.md

      - name: Upload Release Notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  publish:
    name: Publish ${{ matrix.package.name }}
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    strategy:
      matrix:
        package:
          - name: "@but212/atom-effect"
            dir: "packages/core"
          - name: "@but212/atom-effect-jquery"
            dir: "packages/jquery"

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Build and Test
        run: |
          pnpm build
          pnpm typecheck
          pnpm test:run

      - name: Publish
        uses: ./.github/actions/publish
        with:
          package-name: ${{ matrix.package.name }}
          working-directory: ${{ matrix.package.dir }}
          npm-token: ${{ secrets.NPM_TOKEN }}

  release:
    name: Create GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download Release Notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
