name: "Publish Package"
description: "Publishes a package to NPM with provenance"

inputs:
  package-name:
    description: "Name of the package for logging"
    required: true
  working-directory:
    description: "Directory of the package to publish"
    required: true
  npm-token:
    description: "NPM auth token"
    required: true

runs:
  using: "composite"
  steps:
    - name: Publish ${{ inputs.package-name }}
      working-directory: ${{ inputs.working-directory }}
      run: pnpm publish --no-git-checks --provenance
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
